name: Release
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || contains(github.event.head_commit.message, '[publish]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            platform: mac
            app: mac-arm64/线上经营工具.app
          - os: macos-15-intel
            arch: x64
            platform: mac
            app: mac/线上经营工具.app
          - os: windows-latest
            arch: x64
            platform: win
            app: win-unpacked
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native architecture and release version
        shell: bash
        run: |
          node -e "if(process.arch !== '${{ matrix.arch }}') process.exit(1)"
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then exit 1; fi
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
      - name: Bundle native Python runtime and timezone data
        run: |
          python -m pip install pyinstaller==6.22.3 tzdata==2026.6
          python -m PyInstaller --onedir --console --hidden-import tzdata --collect-data tzdata --name tutianduo-workbench --distpath build/workbench-v1.0.3-dist --workpath build/workbench-v1.0.3-tmp --specpath build/workbench-v1.0.3-spec workbench/app.py
      - run: npx vite build
      - name: Package native installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [ '${{ matrix.platform }}' = mac ]; then
            npx electron-builder --mac dmg --${{ matrix.arch }} --publish never -c.afterPack=./scripts/sign-mac-adhoc.cjs '-c.mac.artifactName=online-operations_${version}_macos_${arch}.${ext}'
          else
            npx electron-builder --win nsis --x64 --publish never '-c.win.artifactName=online-operations_${version}_windows_${arch}.${ext}'
          fi
      - name: Verify bundled standalone runtime
        shell: bash
        run: node scripts/verify-release-runtime.cjs "release/$VERSION/${{ matrix.app }}" '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*/*.dmg
            release/*/*.exe
            runtime-verification/*.json
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          merge-multiple: true
      - name: Collect and verify all three installers
        shell: bash
        run: |
          mkdir public-assets
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          for NAME in "online-operations_${VERSION}_macos_arm64.dmg" "online-operations_${VERSION}_macos_x64.dmg" "online-operations_${VERSION}_windows_x64.exe"; do
            mapfile -t FOUND < <(find downloaded -type f -name "$NAME")
            [ "${#FOUND[@]}" -eq 1 ] || exit 1
            cp "${FOUND[0]}" "public-assets/$NAME"
          done
          cp downloaded/runtime-verification/*.json public-assets/
          cp docs/INSTALL_RELEASE.md public-assets/INSTALL.md
          (cd public-assets && sha256sum *.dmg *.exe > SHA256SUMS.txt)
          node scripts/extract-changelog.js > release-notes.md
          cat docs/INSTALL_RELEASE.md >> release-notes.md
      - name: Publish only after every native build passes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" public-assets/* --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md public-assets/*
          fi
