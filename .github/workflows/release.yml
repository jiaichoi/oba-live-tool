name: Release
# A [publish] commit on main rebuilds the current package version's release assets.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published, edited]

jobs:
  release:
    if: github.event_name == 'release' || github.ref_type == 'tag' || contains(github.event.head_commit.message, '[publish]')
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest] 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $EXPECTED_TAG" >&2
            exit 1
          fi

      - name: install dependencies
        run: npm ci

      - name: Test order reader
        run: npm test

      - name: Setup Python for bundled order workbench
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bundle order workbench runtime
        run: |
          python -m pip install pyinstaller==6.22.3
          python -m PyInstaller --onedir --console --name tutianduo-workbench --distpath build/workbench-v1.0.3-dist --workpath build/workbench-v1.0.3-tmp --specpath build/workbench-v1.0.3-spec workbench/app.py

      - name: build application
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 提取 changelog 里当前版本的内容，并保存到 output 中
      # 多行内容需要使用 <<EOF 和 EOF 包裹
      # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/workflow-commands-for-github-actions#multiline-strings 
      - name: Extract changelog
        id: changelog
        shell: bash
        run: | 
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          node scripts/extract-changelog.js >> $GITHUB_OUTPUT  
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          RELEASE_VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.tag }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.changelog.outputs.notes }} # 拿到上一步提取出的 changelog 内容
          files: |
            release/*/*.exe
            release/*/*.zip
            release/*/*.dmg
            release/*/*.blockmap
            release/*/latest*.yml

          # draft: true
          # prerelease: ${{ env.IS_DEV == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 自动注入的 GitHub Token
